<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07070c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Level Up">
  <title>Level Up</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <!-- iOS n'accepte pas les icônes SVG pour l'écran d'accueil : PNG 180×180 obligatoire -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Halo lumineux décoratif en arrière-plan -->
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- Barre du haut : marque + mini-jauge d'XP toujours visible -->
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span>LEVEL UP <small>SAISON 01</small></div>
    <button class="top-xp" id="topXp" data-go="hero" aria-label="Voir mon personnage"></button>
  </header>

  <!-- Les 5 écrans de l'app. Un seul est visible à la fois. -->
  <main id="app">
    <section class="view" id="view-home"></section>
    <section class="view" id="view-train"></section>
    <section class="view" id="view-hero"></section>
    <section class="view" id="view-stats"></section>
    <section class="view" id="view-goals"></section>
  </main>

  <!-- Bouton flottant : enregistrer une séance -->
  <button class="fab" id="fab" data-action="log" aria-label="Enregistrer une séance">
    <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
  </button>

  <!-- Barre d'onglets -->
  <nav class="tabbar">
    <button data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Accueil</span></button>
    <button data-go="train"><svg viewBox="0 0 24 24"><path d="M13 4a2 2 0 1 0 0-.01M7 21l3-6 3 2v4M10 15l1-5 4 3 3-1M8 10l3-2"/></svg><span>Entraîn.</span></button>
    <button data-go="hero"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/></svg><span>Perso</span></button>
    <button data-go="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Stats</span></button>
    <button data-go="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><span>Objectifs</span></button>
  </nav>

  <!-- Fenêtres superposées -->
  <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
  <div class="toasts" id="toasts"></div>
  <div class="levelup" id="levelup"></div>
  <div class="runner" id="runner"></div>
  <div class="onboard" id="onboard"></div>
  <div class="update-bar" id="updateBar" role="status"></div>

  <!-- core.js = logique (testée), app.js = affichage -->
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
